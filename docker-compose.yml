services:
  elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.20
    container_name: memesearch-elastic
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: true
      path.repo: ./backup
      xpack.security.transport.ssl.enabled: true
      xpack.security.transport.ssl.verification_mode: certificate
      xpack.security.transport.ssl.key: /usr/share/elasticsearch/config/certs/elastic-certificates.key
      xpack.security.transport.ssl.certificate: /usr/share/elasticsearch/config/certs/elastic-certificates.crt
      xpack.security.transport.ssl.certificate_authorities: /usr/share/elasticsearch/config/certs/elastic-stack-ca.pem
      # cluster.routing.allocation.disk.threshold_enabled: false
    mem_limit: 10GB
    ports:
      - 127.0.0.1:9200:9200
    volumes:
      - ./data/elastic:/usr/share/elasticsearch/data
      - ./backup/elastic/:/usr/share/elasticsearch/backup/elastic/
      - ./certs:/usr/share/elasticsearch/config/certs

  rabbitmq:
    image: rabbitmq:4.3.5
    hostname: rabbitmq
    container_name: memesearch-rabbitmq
    restart: unless-stopped
    ports:
      - 127.0.0.1:5672:5672
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq/mnesia
    # Soft default is 1024; classic-queue segment files then hit emfile and
    # leave image_data as a zombie (dead PID, live metadata).
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  loki:
    image: grafana/loki:3.7.6
    container_name: loki
    hostname: loki
    restart: unless-stopped
    ports:
      - 127.0.0.1:3100:3100
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./configs/loki.yaml:/etc/loki/local-config.yaml
      - ./data/loki/chunks:/loki/chunks

  alloy:
    image: grafana/alloy:v1.18.1
    container_name: alloy
    hostname: alloy
    restart: unless-stopped
    user: root
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./data/alloy:/var/lib/alloy/data
      - ./configs/alloy.alloy:/etc/alloy/config.alloy
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./logs:/var/log
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:13.1.4
    container_name: grafana
    hostname: grafana
    restart: unless-stopped
    ports:
      - 127.0.0.1:3001:3000
    environment:
      ELASTIC_USERNAME: ${ELASTIC_USERNAME}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
    volumes:
      - ./data/grafana:/var/lib/grafana
      # - ./data/grafana/conf:/etc/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - loki

  mysql:
    image: mariadb:11.4
    container_name: memesearch-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:9507:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
      MARIADB_AUTO_UPGRADE: 'yes'
      TZ: 'Asia/Tbilisi'
    env_file:
      - ./.mysql.env
    command:
     - --skip-grant-tables
     - --innodb-buffer-pool-size=128M
     - --wait_timeout=65

  nlp:
    container_name: nlp
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      AMQP_ENDPOINT: 'amqp://rabbitmq:5672'
      PYTHONUNBUFFERED: 1
      NLTK_DATA: /app/nltk_data
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./services/nlp.py:/app/services/nlp.py
      - ./data/nlp:/app
    command: ["python", "/app/services/nlp.py"]
    depends_on:
      - rabbitmq

  # Extended containers

  telegram-api-server:
    container_name: api
    extends:
      file: ../TelegramApiServer/docker-compose.yml
      service: api
    env_file:
      - ../TelegramApiServer/.env.docker
      - ./.env
      - ./.mysql.env
    depends_on:
      - mysql

  telegram-rss:
    container_name: memesearch-telegram-rss
    extends:
      file: ../TelegramRSS/docker-compose.yml
      service: telegram-rss
    depends_on:
      - telegram-api-server

networks:
  default:
    driver: bridge
    name: memesearch
